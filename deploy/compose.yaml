services:
  blog:
    image: ${BLOG_IMAGE:-ghcr.io/itfetter/itfetter-blog-dev-notes:latest}
    container_name: ${BLOG_CONTAINER_NAME:-itfetter-dev-notes}
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BLOG_PORT: ${BLOG_PORT:-3101}
      BLOG_ADMIN_USERNAME: ${BLOG_ADMIN_USERNAME:-admin}
    volumes:
      - ./data:/data
      - ./secrets/blog-admin-password:/run/secrets/blog-admin-password:ro
    healthcheck:
      test: ["CMD", "python", "-B", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['BLOG_PORT'] + '/content.js', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
