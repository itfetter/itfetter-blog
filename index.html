  <style>

    @media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--bg:#1b1a18;--surface:#22211e;--ink:#f1ece3;--muted:#b7aea2;--line:#3c3730;--accent:#f1a38c;--soft:#3e2a24;--button:#f0e9de;--button-text:#242019}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer;color:inherit}a,button{transition:background-color .16s,color .16s,border-color .16s}a:hover{color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:4px}h1,h2,h3,p{margin:0}button:disabled{cursor:default}.wrap{width:min(1080px,calc(100% - 64px));margin-inline:auto}.mono,time,kbd{font-family:var(--mono);font-variant-numeric:tabular-nums}.skip{position:fixed;top:10px;left:10px;transform:translateY(-180%);background:var(--surface);padding:8px;z-index:10}.skip:focus{transform:none}
    .header{border-bottom:1px solid var(--line)}.header-inner{display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:24px}.brand{display:inline-flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.03em}.mark{display:grid;place-items:center;width:34px;height:34px;background:var(--soft);color:var(--accent);border-radius:9px;font:700 15px var(--mono)}.nav,.tools{display:flex;align-items:center;gap:22px}.nav a{font-size:.9rem;color:var(--muted);padding-block:9px}.nav a[aria-current=page],.nav a:hover{color:var(--accent)}.tools{gap:8px}.icon{min-height:42px;min-width:42px;border:1px solid var(--line);border-radius:9px;background:transparent;display:inline-grid;place-items:center}.icon:hover,.pill:hover{background:var(--soft);color:var(--accent)}.search-button{display:flex;gap:9px;align-items:center;padding:0 10px;font-size:.875rem}.lens{width:13px;height:13px;border:1.5px solid currentColor;border-radius:50%;position:relative;margin-right:3px}.lens:after{content:"";position:absolute;width:6px;height:1.5px;background:currentColor;right:-5px;bottom:-2px;transform:rotate(45deg)}kbd{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
    .hero{display:grid;grid-template-columns:1.13fr 1fr;align-items:center;gap:48px;padding-block:58px 52px}.eyebrow{color:var(--accent);font-size:.81rem;font-weight:700;letter-spacing:.14em}.hero h1{font:700 clamp(2.3rem,5.2vw,4.05rem)/1.22 var(--serif);letter-spacing:-.055em;margin:15px 0 18px}.hero h1 span{color:var(--accent)}.hero p{max-width:29rem;color:var(--muted);line-height:1.85}.actions{display:flex;align-items:center;gap:20px;margin-top:26px}.primary{display:inline-flex;align-items:center;background:var(--button);color:var(--button-text);border-radius:8px;padding:9px 17px;font-size:.9rem;font-weight:650;min-height:44px}.primary:hover{background:var(--accent);color:var(--bg)}.quiet{font-size:.9rem;text-decoration:underline;text-underline-offset:5px}
    .hero-art{min-height:290px;position:relative;isolation:isolate;overflow:hidden;border:1px solid #e4d3c3;border-radius:17px;background-color:#efe1d2;background-image:radial-gradient(#b99177 1px,transparent 1px);background-size:19px 19px;display:grid;place-items:center;color:#f6e8da}.terminal{position:relative;width:73%;z-index:2;transform:rotate(-5deg);border:1px solid #54463d;border-radius:12px;background:#2a2624;box-shadow:9px 11px 0 #be9276;overflow:hidden;font:clamp(.66rem,1.4vw,.84rem)/1.76 var(--mono)}.terminal-bar{border-bottom:1px solid #52453e;padding:7px 12px;display:flex;gap:5px;align-items:center;color:#cbb9ab}.terminal-bar i{width:6px;height:6px;border-radius:50%;background:#d6967f}.terminal-bar i:nth-child(2){background:#d0b19a}.terminal-bar i:nth-child(3){background:#a5a489}.terminal-bar span{margin-left:auto}.terminal-code{padding:15px 13px 19px;white-space:nowrap}.terminal-code b{color:#efaa8b;font-weight:500}.terminal-code em{font-style:normal;color:#c2b3a6}.paper{position:absolute;width:50%;height:66%;border-radius:10px;border:1px solid #c99f84;right:12%;top:13%;transform:rotate(11deg);background:#f8ebdd repeating-linear-gradient(0deg,transparent 0 17px,#e8cdb9 18px 19px)}.art-label{position:absolute;bottom:11px;right:14px;color:#704d3e;font:11px var(--mono);letter-spacing:.11em}
    .section{padding:25px 0 32px;border-top:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.section-head h2,.reading h2{font:700 1.65rem/1.45 var(--serif)}.section-head p,.subtle{color:var(--muted);font-size:.875rem}.section-head a{font-size:.875rem;color:var(--accent);white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}.card:hover{border-color:var(--accent)}.card-body{padding:16px 17px 19px}.card h3{font-size:1.125rem;line-height:1.5;margin:7px 0 6px;letter-spacing:-.025em}.card p{font-size:.875rem;color:var(--muted)}.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.8125rem}.tag{color:var(--accent);font-weight:650}.cover{height:113px;display:grid;place-items:center;overflow:hidden;position:relative;font:700 1rem var(--mono);background:#eddbce;color:#713a28}.cover:before{content:"";position:absolute;inset:0;background-image:radial-gradient(currentColor .65px,transparent .65px);background-size:12px 12px;opacity:.23}.cover>span{position:relative;border:1px solid currentColor;border-radius:7px;padding:9px 14px;background:#f6e7db;transform:rotate(-7deg);box-shadow:5px 5px 0 #c9957d}.cover.dev{background:#dfe4d8;color:#465342}.cover.dev>span{background:#eff2e7;transform:rotate(6deg);box-shadow:5px 5px 0 #a1ac96}.cover.note{background:#e8e0ef;color:#5e4c76}.cover.note>span{background:#f4eef7;box-shadow:5px 5px 0 #b7a4c5}
    .page-intro{padding:54px 0 23px}.page-intro h1,.reading h1{font:700 clamp(2.2rem,6vw,3.2rem)/1.3 var(--serif);letter-spacing:-.04em;margin-bottom:10px}.page-intro p,.reading .lede{color:var(--muted)}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}.pill{display:inline-flex;align-items:center;min-height:42px;padding:5px 13px;background:transparent;border:1px solid var(--line);border-radius:8px;font-size:.875rem}.pill[aria-current=true]{color:var(--accent);border-color:var(--accent);background:var(--soft)}.year{margin-top:24px;font:700 1.125rem var(--mono);color:var(--muted)}.rows{padding:0;margin:0;list-style:none}.rows li{border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:7.2rem minmax(0,1fr) auto;align-items:baseline;gap:12px;padding:13px 0}.row strong{font-size:1rem}.row:hover strong{text-decoration:underline;text-underline-offset:4px}
    .reading{width:min(720px,100%);padding:38px 0 54px;margin-inline:auto}.back{display:inline-block;font-size:.9rem;color:var(--accent);margin-bottom:24px}.reading .lede{font-size:1.125rem;margin:14px 0 22px}.reading .meta{margin-bottom:10px}.reading p{line-height:1.95;margin-bottom:15px}.reading h2{margin:29px 0 9px;scroll-margin-top:18px}.toc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 20px;font-size:.9rem;margin:20px 0 27px}.toc ol{margin:5px 0 0;padding-left:22px}.toc a,.prose-link{text-decoration:underline;text-underline-offset:4px}.reading pre{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 16px;font: .875rem/1.75 var(--mono)}.related{border-top:1px solid var(--line);padding-top:20px;margin-top:30px}.related a{color:var(--accent)}
    main{min-height:65vh;padding-bottom:24px}footer{border-top:1px solid var(--line);color:var(--muted);font-size:.875rem}.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:78px}.footer-links{display:flex;gap:18px}.search-dialog{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(560px,calc(100% - 30px));max-height:75dvh;padding:16px;margin:12vh auto auto}.search-dialog::backdrop{background:#25201dc0}.search-form{display:flex;gap:10px;align-items:center}.search-form input{min-width:0;flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}.search-results{padding-top:12px}.search-results a{display:block;padding:8px;border-radius:7px}.search-results a:hover{background:var(--soft)}.search-results small{display:block;color:var(--muted)}
    @media(max-width:750px){.wrap{width:calc(100% - 40px)}.hero{gap:24px;padding-block:39px 34px}.hero-art{min-height:222px}.terminal{width:81%}.hero h1{font-size:clamp(2.1rem,6vw,3.1rem)}.cards{gap:10px}.card-body{padding:12px}.nav{gap:13px}.header-inner{gap:12px}.search-button span:not(.lens),.search-button kbd{display:none}.search-button{justify-content:center}.cover{height:92px}}
    @media(max-width:560px){.wrap{width:calc(100% - 32px)}.header-inner{flex-wrap:wrap;gap:0;min-height:0;padding-top:9px}.nav{order:3;width:100%;gap:24px;margin-top:1px}.nav a{display:inline-flex;align-items:center;min-height:43px}.hero{grid-template-columns:1fr;padding-block:31px 29px;gap:23px}.hero-art{min-height:210px}.terminal{width:min(75%,280px);font-size:.75rem}.hero p{font-size:.9375rem}.actions{margin-top:17px}.cards{grid-template-columns:1fr;gap:13px}.card{display:grid;grid-template-columns:86px minmax(0,1fr)}.cover{height:auto;min-height:100%;font-size:.67rem}.cover>span{padding:5px;box-shadow:3px 3px 0 #0003}.card h3{font-size:1rem}.row{grid-template-columns:1fr auto;gap:3px 8px}.row time{grid-column:1/-1}.page-intro{padding-top:32px}.footer-inner{flex-wrap:wrap;padding-block:12px}.section-head{align-items:start}.reading{padding-top:26px}}
    main:focus{outline:none}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

  <header class="header">
    <div class="wrap header-inner">
      <a class="brand" href="#home"><span class="mark" aria-hidden="true">&gt;_</span>itfetter</a>
      <nav class="nav" aria-label="主导航"><a href="#home">首页</a><a href="#archive">文章</a><a href="#about">关于</a></nav>
      <div class="tools">
        <button class="icon search-button" id="open-search" aria-label="搜索文章"><span class="lens" aria-hidden="true"></span><span>搜索</span><kbd aria-hidden="true">/</kbd></button>
        <button class="icon" id="theme" aria-label="切换配色"></button>

  <main id="main" class="wrap" tabindex="-1"><noscript>请启用 JavaScript 浏览博客原型。</noscript></main>
  <footer><div class="wrap footer-inner"><span>© 2026 itfetter · 开发手记</span><div class="footer-links"><a href="#about">关于本站</a><a href="https://github.com/itfetter">GitHub</a></div></div></footer>
  <dialog class="search-dialog" id="search" aria-label="搜索文章">
    <div class="search-form"><input type="search" id="query" aria-label="搜索关键词" placeholder="搜索标题、主题或正文…" autofocus><form method="dialog"><button class="icon" aria-label="关闭搜索">×</button></form></div>
    <div class="search-results" id="results" aria-live="polite"></div>
  </dialog>
  <script>
    const topics = {ai: 'AI 体验', dev: '个人开发', note: '随手记'};
    const posts = [
      {id:'working-with-coding-agents', topic:'ai', date:'2026-11-18', featured:'agent.run()', title:'把 AI 编程接进日常之后', summary:'从理解项目到审查提交，一套可以反复用的协作流程。', sections:[
        ['先约定交付长什么样','同样是「修一下列表」，可能指移动端溢出，也可能指排序结果不对。发任务前，写下从哪里进入、操作到哪一步、预期看到什么。验收描述越具体，后面越容易判断改动是否跑偏。'],
        ['把理解和修改拆开','先让工具定位入口和已有的验证命令，再动手改一件事。读提交时从用户入口开始，沿着数据走到最终状态，确认每一步仍符合现有行为。'],
        ['留一份能接力的记录','结束时记下这次跑过的命令、手动试过的步骤，以及仍需确认的地方。隔几天回看时，这几行比整段对话更容易用。','已验证：空列表、长标题、移动端折行\n待确认：生产数据下的分页表现'] ]},
      {id:'small-tool-first-release', topic:'dev', date:'2026-11-12', featured:'git push', title:'一个小工具的第一个可用版本', summary:'先做通最常用的一条路径，再决定哪些想法值得继续做。', sections:[
        ['从手工做过的任务开始','拿三条真实记录跑一遍原来的流程。先记下最耗时的那一步，例如每周重复把一组链接整理成可发给同事的清单。它就是首版要解决的问题。'],
        ['让失败也有下一步','粘贴内容里混有空行时可以照常整理。遇到无法识别的地址，直接指出具体是哪一行，让用户修改后继续。'],
        ['把交付条件写下来','从空白页面开始，粘贴、预览、复制，三步可以完成一次真实任务。再把这条路径交给第一次看到工具的人试一遍。']]},
      {id:'notes-worth-keeping', topic:'note', date:'2026-11-06', featured:'notes.md', title:'给试过的东西留一份笔记', summary:'记录当时想解决的问题，以及哪些尝试值得下次复用。', sections:[
        ['把具体问题写在开头','「尝试了一个新工具」很难在下次遇到问题时搜出来。标题写成「怎么把浏览器里的片段整理成 Markdown」，以后还能用自己的话把它找回来。'],
        ['留下结果和条件','记下用的输入、耗时，以及哪一步仍然要手工处理。短笔记也可以用这三个信息交代清楚一次实验。'],
        ['复用时补充一行','第二次用同一方法时，把变化追加到原来的笔记。几次积累之后，就能看清哪些步骤适合做进工具。']]},
      {id:'same-task-two-prompts',topic:'ai',date:'2026-10-29',title:'用同一个任务比较两种提示写法',summary:'从输出的可验证性和返工次数评估一次提示调整。',sections:[['固定输入','选一段能快速验收的文档，保留相同的原文和输出格式。第一种提示只给任务，第二种加上范围和验收条件。'],['看得见的比较','逐项标记输出里哪些内容能从原文核对，再记下补充指令的次数。换几个不同题材的样本，才容易看出哪些条件确实值得保留。']]},
      {id:'bookmark-export',topic:'dev',date:'2026-10-17',title:'写一个浏览器书签整理脚本',summary:'用现成的书签导出文件验证整理规则。',sections:[['保留原始文件','先把浏览器导出的书签文件留作备份。整理脚本读取副本并输出一张清单，便于对比原有的文件夹层级。'],['检查重复和标题','同一网址可能有不同的名字，也可能被放进多个文件夹。先在预览里展示这些差异，再决定哪些条目适合合并。']]},
      {id:'weekly-review',topic:'note',date:'2025-12-21',title:'周末项目的一次简单复盘',summary:'把下次打开仓库时最有用的三件事写下来。',sections:[['先记现在能做什么','打开项目，从使用者的视角把能做成的那件事完整走一遍。把入口、数据和关键操作写在同一处，给下一次工作留个起点。'],['给下次留一个可完成的任务','选一个两小时内能验证的改动，记录它解决的使用问题和验收步骤。下次从这里开始，会比重新规划整周容易。']]}
    ];

    const main = document.querySelector('main');
    const dialog = document.querySelector('#search');
    const query = document.querySelector('#query');
    const results = document.querySelector('#results');
    const theme = document.querySelector('#theme');
    const systemTheme = matchMedia('(prefers-color-scheme: dark)');
    const postLink = post => `#post/${post.id}`;
    const date = post => `<time datetime="${post.date}">${post.date.replaceAll('-', '.')}</time>`;
    const metadata = post => `<div class="meta"><span class="tag">${topics[post.topic]}</span>${date(post)}</div>`;
    const row = post => `<li><a class="row" href="${postLink(post)}">${date(post)}<strong>${post.title}</strong><span class="meta tag">${topics[post.topic]}</span></a></li>`;

    function home() {
      return `<section class="hero" aria-labelledby="welcome"><div><div class="eyebrow mono">ITFETTER / 开发手记</div>
        <h1 id="welcome">写代码，也写下<br><span>做东西的过程。</span></h1>
        <p>这里记录个人项目是怎么做出来的，AI 工具用起来怎么样，以及开发途中值得留一笔的小发现。</p>
        <div class="actions"><a class="primary" href="#archive">浏览文章</a><a class="quiet" href="#about">关于这个博客</a></div></div>
        <div class="hero-art" aria-hidden="true"><div class="paper"></div><div class="terminal"><div class="terminal-bar"><i></i><i></i><i></i><span>~/workbench</span></div><div class="terminal-code"><b>$</b> git status --short<br><em> M</em> projects/side-project<br><em>??</em> notes/ai-workflow.md<br><b>$</b> <span>▌</span></div></div><span class="art-label">THE WORKBENCH</span></div></section>
        <section class="section"><div class="section-head"><div><h2>精选文章</h2><p>从这三篇认识这个博客</p></div><a href="#archive">全部文章</a></div><div class="cards">${posts.filter(post => post.featured).map(post => `<a class="card" href="${postLink(post)}"><div aria-hidden="true" class="cover ${post.topic}"><span>${post.featured}</span></div><div class="card-body">${metadata(post)}<h3>${post.title}</h3><p>${post.summary}</p></div></a>`).join('')}</div></section>
        <section class="section"><div class="section-head"><h2>最近更新</h2><span class="subtle">原型样稿</span></div><ul class="rows">${posts.slice(0,4).map(row).join('')}</ul></section>`;
    }

    function archive(topic) {
      const selected = Object.hasOwn(topics, topic) ? topic : '';
      const visible = posts.filter(post => !selected || post.topic === selected);
      const years = [...new Set(visible.map(post => post.date.slice(0,4)))];
      return `<div class="page-intro"><h1>文章归档</h1><p>${visible.length} 篇样稿，按发布时间排列。</p></div>
        <nav class="filters" aria-label="按主题筛选">${[['','全部'],...Object.entries(topics)].map(([key, name]) => `<a class="pill" href="#archive${key ? '/' + key : ''}"${key === selected ? ' aria-current="true"' : ''}>${name}</a>`).join('')}</nav>
        ${years.map(year => `<section><h2 class="year">${year}</h2><ul class="rows">${visible.filter(post => post.date.startsWith(year)).map(row).join('')}</ul></section>`).join('')}`;
    }

    function article(post) {
      const related = posts.find(item => item.topic === post.topic && item !== post);
      return `<article class="reading"><a class="back" href="#archive">返回文章归档</a>${metadata(post)}<h1>${post.title}</h1><p class="lede">${post.summary}</p><p class="subtle">原型样稿</p>
        <nav class="toc" aria-label="本文目录"><strong>本文目录</strong><ol>${post.sections.map(([heading], i) => `<li><a href="${postLink(post)}/${i + 1}">${heading}</a></li>`).join('')}</ol></nav>
        ${post.sections.map(([heading, body, code], i) => `<section><h2 id="section-${i + 1}" tabindex="-1">${heading}</h2><p>${body}</p>${code ? `<pre><code>${code}</code></pre>` : ''}</section>`).join('')}
        ${related ? `<div class="related"><span class="subtle">继续阅读</span><br><a href="${postLink(related)}">${related.title}</a></div>` : ''}</article>`;
    }

    function render() {
      const [page, key, section] = (location.hash.slice(1) || 'home').split('/');
      const post = page === 'post' && posts.find(item => item.id === key);
      const current = page === 'post' ? 'archive' : page;
      document.querySelectorAll('.nav a').forEach(link => {
        if (link.hash === `#${current}`) link.setAttribute('aria-current','page');
        else link.removeAttribute('aria-current');
      });
      document.title = `${post ? post.title : ({archive:'文章归档',about:'关于本站'})[page] || '开发手记'} · itfetter`;
      if (page === 'home') main.innerHTML = home();
      else if (page === 'archive') main.innerHTML = archive(key);
      else if (post) main.innerHTML = article(post);
      else if (page === 'about') main.innerHTML = `<article class="reading"><h1>关于这个博客</h1><p class="lede">itfetter 的个人开发手记。</p><p>这里会写自己动手做的小项目、日常和 AI 一起工作的体验，以及后来想翻回来看一眼的技术笔记。项目是怎么开始的、工具在哪一步帮了忙、做完后想改哪里，都是值得记下的内容。</p><h2>从哪里开始读</h2><p>可以去 <a class="prose-link" href="#archive">文章归档</a> 按主题找感兴趣的样稿，也可以去 <a class="prose-link" href="https://github.com/itfetter">GitHub</a> 看项目。</p></article>`;
      else main.innerHTML = '<div class="page-intro"><h1>没有找到这个页面</h1><a class="quiet" href="#archive">浏览文章归档</a></div>';
      const heading = post && section && document.getElementById(`section-${section}`);
      if (heading) {
        heading.focus();
        heading.scrollIntoView();
      } else {
        main.focus({preventScroll:true});
        window.scrollTo(0,0);
      }
    }

    function search() {
      const terms = query.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const matches = posts.filter(post => {
        const content = [post.title, topics[post.topic], post.summary, ...post.sections.flat()].join(' ').toLowerCase();
        return terms.every(term => content.includes(term));
      });
      results.innerHTML = matches.length ? matches.map(post => `<a href="${postLink(post)}">${post.title}<small>${topics[post.topic]} · ${post.date}</small></a>`).join('') : '<p class="subtle">没有匹配的文章，试试「AI」或「笔记」。</p>';
    }

    function openSearch() {
      if (dialog.open) return;
      query.value = '';
      search();
      dialog.showModal();
    }

    function updateThemeButton() {
      const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && systemTheme.matches);
      theme.textContent = dark ? '☀' : '☾';
      theme.setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
      theme.title = theme.getAttribute('aria-label');
    }

    theme.addEventListener('click', () => {
      const mode = document.documentElement.dataset.theme || (systemTheme.matches ? 'dark' : 'light');
      const next = mode === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('itfetter-theme', next); } catch {}
      updateThemeButton();
    });
    systemTheme.addEventListener('change', updateThemeButton);
    document.querySelector('#open-search').addEventListener('click', openSearch);
    query.addEventListener('input', search);
    results.addEventListener('click', event => {
      if (event.target.closest('a')) dialog.close();
    });
    document.addEventListener('keydown', event => {
      const command = (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k';
      const slash = event.key === '/' && !event.target.closest('input,textarea,[contenteditable]');
      if (command || slash) {
        event.preventDefault();
        openSearch();
      }
    });
    document.querySelector('.skip').addEventListener('click', event => {
      event.preventDefault();
      main.focus();
    });
    window.addEventListener('hashchange', render);
    updateThemeButton();
    render();
  </script>
</body>
</html>
