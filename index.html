<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="itfetter 的个人博客，记录个人开发、AI 工具实测和日常技术笔记。">
  <title>itfetter · 开发手记</title>
  <script>
    try {
      const saved = localStorage.getItem('itfetter-theme');
      if (saved) document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <style>
    :root {
      color-scheme:light;
      --bg:#fff;--surface:#fff;--subtle:#f7f8fa;--hover:#f1f3f6;
      --ink:#16191f;--muted:#545c6b;--line:#e2e6ed;--strong-line:#cdd3de;
      --accent:#204fbb;--accent-hover:#194298;--selected:#edf3ff;--on-accent:#fff;
      --mono:ui-monospace,SFMono-Regular,Consolas,monospace
    }
    :root[data-theme=dark] {
      color-scheme:dark;
      --bg:#15171b;--surface:#1a1d23;--subtle:#20242b;--hover:#272c34;
      --ink:#f0f2f5;--muted:#b2bac7;--line:#303641;--strong-line:#465063;
      --accent:#9bb9ff;--accent-hover:#c1d2ff;--selected:#252f45;--on-accent:#101a2f
    }
    @media(prefers-color-scheme:dark){
      :root:not([data-theme]){
        color-scheme:dark;
        --bg:#15171b;--surface:#1a1d23;--subtle:#20242b;--hover:#272c34;
        --ink:#f0f2f5;--muted:#b2bac7;--line:#303641;--strong-line:#465063;
        --accent:#9bb9ff;--accent-hover:#c1d2ff;--selected:#252f45;--on-accent:#101a2f
      }
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    h1,h2,h3,p{margin:0}
    a{color:inherit;text-decoration:none}
    button,input,textarea{font:inherit}
    button{color:inherit;cursor:pointer}
    button:disabled{cursor:default;opacity:.5}
    a,button,summary{transition:background-color .16s,color .16s,border-color .16s}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .wrap{width:min(1080px,calc(100% - 64px));margin-inline:auto}
    .mono, time, kbd{font-family:var(--mono);font-variant-numeric:tabular-nums}
    .subtle{color:var(--muted);font-size:.875rem}
    .skip{position:fixed;top:10px;left:10px;transform:translateY(-180%);background:var(--surface);padding:8px;z-index:10}
    .skip:focus{transform:none}
    .header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
    .header-inner{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px}
    .brand{display:inline-flex;align-items:center;gap:8px;font-weight:750;letter-spacing:-.025em}
    .mark{display:grid;place-items:center;width:31px;height:31px;border:1px solid var(--line);border-radius:8px;color:var(--accent);font:700 .875rem var(--mono)}
    .nav,.tools,.actions,.filters{display:flex;align-items:center;gap:6px}
    .nav a,.studio-link,.icon,.primary,.secondary,.pill{min-height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;padding:5px 12px;white-space:nowrap;font-size:.875rem;font-weight:600}
    .nav a,.studio-link{color:var(--muted)}
    .nav a:hover,.studio-link:hover,.icon:hover,.secondary:hover,.pill:hover{background:var(--hover);color:var(--ink)}
    .nav a[aria-current=page],.studio-link[aria-current=page],.pill[aria-current=true]{background:var(--selected);color:var(--accent)}
    .icon,.secondary,.pill{border:1px solid var(--line);background:var(--surface)}
    .icon{min-width:42px;padding-inline:9px}
    .search-button{gap:9px;color:var(--muted)}
    .lens{display:inline-block;flex:none;width:13px;height:13px;border:1.5px solid currentColor;border-radius:50%;position:relative;margin-right:3px}
    .lens:after{content:"";position:absolute;width:6px;height:1.5px;background:currentColor;right:-5px;bottom:-2px;transform:rotate(45deg)}
    kbd{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 4px;white-space:nowrap}
    .primary{border:1px solid transparent;background:var(--accent);color:var(--on-accent)}
    .primary:hover:not(:disabled){background:var(--accent-hover)}
    .primary:active:not(:disabled),.secondary:active,.icon:active{transform:translateY(1px)}
    main{min-height:72vh;padding-bottom:36px}
    main:focus{outline:none}
    .hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:56px;padding:58px 0 44px}
    .hero-author{font-size:.875rem;font-weight:650;color:var(--muted)}
    .hero h1{font-size:clamp(2.6rem,5.8vw,4.25rem);font-weight:760;line-height:1.16;letter-spacing:-.065em;margin:8px 0 15px}
    .hero-description{color:var(--muted);max-width:34em;line-height:1.85}
    .actions{gap:10px;margin-top:20px}
    .feature{display:flex;flex-direction:column;gap:8px;padding:22px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
    .feature:hover{border-color:var(--strong-line);background:var(--subtle)}
    .feature-label{font-size:.8125rem;font-weight:700;color:var(--accent)}
    .feature h2{font-size:1.3rem;line-height:1.45;letter-spacing:-.025em}
    .feature:hover h2,.row:hover strong{color:var(--accent)}
    .feature p,.row small{font-size:.875rem;color:var(--muted)}
    .feature .meta{margin-top:3px}
    .meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.8125rem}
    .tag{color:var(--muted);font-size:.8125rem;font-weight:650}
    .home-grid{display:grid;grid-template-columns:minmax(0,1fr) 242px;gap:34px;border-top:1px solid var(--line);padding-top:24px}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
    .section-head h2{font-size:1.25rem;letter-spacing:-.025em}
    .section-head a,.back,.related a,.prose-link,.quiet{color:var(--accent);font-size:.875rem}
    .section-head a:hover,.back:hover,.related a:hover,.prose-link:hover,.quiet:hover{text-decoration:underline;text-underline-offset:4px}
    .home-aside{border-left:1px solid var(--line);padding-left:21px}
    .home-aside section + section{margin-top:24px}
    .home-aside h2{font-size:.9rem;margin-bottom:9px}
    .topic-list,.rows{padding:0;margin:0;list-style:none}
    .topic-list a,.aside-link{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:7px;font-size:.875rem;min-height:38px}
    .topic-list a span:last-child,.aside-link small{color:var(--muted);font-variant-numeric:tabular-nums}
    .topic-list a:hover,.aside-link:hover{background:var(--hover);color:var(--accent)}
    .aside-link{display:block;padding-block:8px}
    .aside-link small{display:block;margin-top:4px}
    .row{display:grid;grid-template-columns:6.35rem minmax(0,1fr) auto;align-items:baseline;gap:12px;padding:12px 8px;border-radius:7px}
    .rows li + li{border-top:1px solid var(--line)}
    .row:hover{background:var(--subtle)}
    .row time{font-size:.8125rem;color:var(--muted)}
    .row strong{font-size:1rem;line-height:1.45}
    .row small{display:block;line-height:1.6;margin-top:2px}
    .projects-section{border-top:1px solid var(--line);margin-top:24px;padding-top:23px}
    .page-intro{padding:44px 0 21px}
    .page-intro h1,.reading h1{font-size:clamp(2rem,4.6vw,3rem);line-height:1.2;letter-spacing:-.05em;font-weight:750;margin-bottom:11px}
    .page-intro p,.reading .lede{color:var(--muted)}
    .filter-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
    .filters{flex-wrap:wrap}
    .pill{min-height:38px;font-weight:600}
    .pill[aria-current=true]{border-color:var(--selected)}
    .year{margin:22px 0 5px;color:var(--muted);font:700 .95rem var(--mono)}
    .index-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .index-card{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:15px 17px;min-width:0}
    .index-card h3{font-size:1.05rem;margin:4px 0}
    .index-card p{color:var(--muted);font-size:.9rem;margin:0 0 9px}
    .index-card a,.index-card summary{color:var(--accent);font-size:.875rem}
    .index-card summary{cursor:pointer;padding-block:6px}
    .progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:6;pointer-events:none}
    .article-grid{display:grid;grid-template-columns:minmax(0,720px) minmax(0,1fr);gap:48px}
    .reading{width:min(720px,100%);padding:36px 0 28px;margin-inline:auto}
    .article-grid .reading{width:100%;margin:0}
    .back{display:inline-block;margin-bottom:21px}
    .reading .meta{margin-bottom:9px}
    .reading .lede{font-size:1.125rem;margin:12px 0 16px}
    .reading p{line-height:1.9;margin-bottom:12px}
    .reading h2{font-size:1.4rem;margin:25px 0 8px;scroll-margin-top:88px;letter-spacing:-.025em}
    .toc{font-size:.875rem;color:var(--muted);border-left:1px solid var(--line);padding-left:12px}
    .article-grid .toc{align-self:start;position:sticky;top:88px;margin-top:68px}
    .toc strong{display:block;color:var(--ink);margin:0 8px 5px}
    .toc ol{list-style:none;margin:0;padding:0}
    .toc a{display:block;padding:6px 8px;border-radius:6px}
    .toc a:hover{background:var(--hover)}
    .toc a[aria-current=location]{background:var(--selected);color:var(--accent)}
    .article-grid .toc-inline{display:none}
    .related{border-top:1px solid var(--line);padding-top:16px;margin-top:24px}
    .code-panel{border:1px solid var(--line);border-radius:9px;background:var(--subtle);overflow:hidden;margin:12px 0 20px}
    .code-bar{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:4px 12px}
    .code-bar button{border:0;border-radius:6px;background:transparent;padding:5px 9px;color:var(--accent);min-height:36px}
    .code-bar button:hover{background:var(--hover)}
    pre{overflow:auto;margin:0;padding:11px 14px;font:.875rem/1.7 var(--mono)}
    .table-scroll{overflow:auto;margin:10px 0 18px}
    .table-scroll table{width:100%;border-collapse:collapse;font-size:.9rem}
    .table-scroll caption{text-align:left;margin-bottom:6px;color:var(--muted)}
    .table-scroll th,.table-scroll td{text-align:left;border-bottom:1px solid var(--line);padding:9px 10px}
    .table-scroll thead{background:var(--subtle)}
    .studio-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .studio-pane{min-width:0;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
    .studio-pane h2,.studio-pane label{display:block;font-size:1rem;font-weight:700;margin-bottom:8px}
    .studio-pane textarea{width:100%;min-height:320px;resize:vertical;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);padding:10px;font:.9rem/1.7 var(--mono)}
    .studio-preview{overflow-wrap:anywhere}
    .studio-preview pre{background:var(--subtle)}
    .studio-preview p,.studio-preview ul{margin:8px 0}
    .studio-actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0}
    footer{border-top:1px solid var(--line);color:var(--muted);font-size:.875rem}
    .footer-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:66px}
    .footer-links{display:flex;gap:18px}
    .footer-links a:hover{color:var(--accent)}
    .search-dialog{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(580px,calc(100% - 28px));max-height:82dvh;padding:14px;margin:9vh auto auto}
    .search-dialog::backdrop{background:#141b2b7d}
    .search-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
    .search-heading h2{font-size:1.05rem}
    .search-heading .icon{border-color:transparent}
    .search-form{display:flex;gap:9px;align-items:center;border:1px solid var(--strong-line);border-radius:8px;padding:0 10px;color:var(--muted)}
    .search-form:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
    .search-form input{min-width:0;flex:1;padding:9px 4px;border:0;outline:0;background:transparent;color:var(--ink)}
    .search-count{padding:10px 4px 5px;color:var(--muted);font-size:.8125rem}
    .search-results{max-height:38dvh;overflow:auto}
    .search-results [role=option]{display:block;padding:7px 9px;border-radius:7px;cursor:pointer}
    .search-results [role=option]:hover,.search-results [aria-selected=true]{background:var(--selected);color:var(--accent)}
    .search-results strong,.search-results small{display:block}
    .search-results small,.search-help{font-size:.8125rem;color:var(--muted)}
    .search-empty{padding:12px 4px 10px;color:var(--muted)}
    .search-empty button{margin-top:8px}
    .search-help{display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);padding:9px 4px 0;margin-top:8px}
    @media(max-width:800px){
      .hero{gap:24px;padding:38px 0 31px}
      .home-grid{grid-template-columns:minmax(0,1fr) 180px;gap:18px}
      .home-aside{padding-left:13px}
      .search-button kbd,.search-button span:not(.lens){display:none}
      .article-grid{display:block}
      .article-grid>.toc{display:none}
      .article-grid .toc-inline{display:block;position:static;margin:16px 0 22px}
    }
    @media(max-width:650px){
      .wrap{width:calc(100% - 32px)}
      .header-inner{flex-wrap:wrap;padding-top:7px;gap:0}
      .nav{order:3;width:100%;gap:3px;padding-block:2px}
      .nav a{padding-inline:9px}
      .hero,.home-grid,.studio-grid,.index-grid{grid-template-columns:1fr}
      .hero{gap:19px;padding-top:25px}
      .feature{padding:14px}
      .home-grid{gap:17px;padding-top:15px}
      .home-aside{border-left:0;border-top:1px solid var(--line);padding:14px 0 0}
      .row{grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;padding-inline:2px}
      .row time{grid-column:1/-1}
      .filter-bar{flex-wrap:wrap}
      .page-intro{padding-top:28px}
      .reading h2{scroll-margin-top:123px}
      .footer-inner{flex-wrap:wrap;padding-block:11px}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>

  <div class="progress" id="progress" aria-hidden="true"></div>
  <header class="header">
    <div class="wrap header-inner">
      <a class="brand" href="#home"><span class="mark" aria-hidden="true">&gt;_</span>itfetter</a>
      <nav class="nav" aria-label="主导航"><a href="#home">首页</a><a href="#archive">文章</a><a href="#notes">笔记</a><a href="#projects">项目</a><a href="#about">关于</a></nav>
      <div class="tools">
        <a class="studio-link" href="#studio">写作台</a>
        <button class="icon search-button" id="open-search" aria-label="搜索文章"><span class="lens" aria-hidden="true"></span><span>搜索</span><kbd aria-hidden="true">Ctrl K</kbd></button>
        <button class="icon" id="theme" aria-label="切换配色"></button>
      </div>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1"><noscript>请启用 JavaScript 浏览博客原型。</noscript></main>
  <footer><div class="wrap footer-inner"><span>© 2026 itfetter · 开发手记</span><div class="footer-links"><a href="#about">关于本站</a><a href="https://github.com/itfetter">GitHub</a></div></div></footer>
  <dialog class="search-dialog" id="search" aria-labelledby="search-label">
    <div class="search-heading"><h2 id="search-label">搜索文章</h2><form method="dialog"><button class="icon" aria-label="关闭搜索">×</button></form></div>
    <div class="search-form"><span class="lens" aria-hidden="true"></span><input type="search" id="query" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="results" aria-label="搜索关键词" placeholder="输入标题、主题或关键词" autocomplete="off" autofocus></div>

  </dialog>
  <script>
    const topics = {ai: 'AI 体验', dev: '个人开发', note: '随手记'};
    const posts = [
      {id:'working-with-coding-agents', topic:'ai', date:'2026-11-18', title:'把 AI 编程接进日常之后', summary:'从理解项目到审查提交，一套可以反复用的协作流程。', sections:[
        ['先约定交付长什么样','同样是「修一下列表」，可能指移动端溢出，也可能指排序结果不对。发任务前，写下从哪里进入、操作到哪一步、预期看到什么。验收描述越具体，后面越容易判断改动是否跑偏。'],
        ['把理解和修改拆开','先让工具定位入口和已有的验证命令，再动手改一件事。读提交时从用户入口开始，沿着数据走到最终状态，确认每一步仍符合现有行为。'],
        ['留一份能接力的记录','结束时记下这次跑过的命令、手动试过的步骤，以及仍需确认的地方。隔几天回看时，这几行比整段对话更容易用。','已验证：空列表、长标题、移动端折行\n待确认：生产数据下的分页表现'],
        ['用验收表比较两次尝试','下面用一个文章列表展示如何逐项核对结果。每项都写成能重做的操作，方便检查提示词的变化到底解决了什么。'] ]},
      {id:'small-tool-first-release', topic:'dev', date:'2026-11-12', title:'一个小工具的第一个可用版本', summary:'先做通最常用的一条路径，再决定哪些想法值得继续做。', sections:[
        ['从手工做过的任务开始','拿三条真实记录跑一遍原来的流程。先记下最耗时的那一步，例如每周重复把一组链接整理成可发给同事的清单。它就是首版要解决的问题。'],
        ['让失败也有下一步','粘贴内容里混有空行时可以照常整理。遇到无法识别的地址，直接指出具体是哪一行，让用户修改后继续。'],
        ['把交付条件写下来','从空白页面开始，粘贴、预览、复制，三步可以完成一次真实任务。再把这条路径交给第一次看到工具的人试一遍。']]},
      {id:'notes-worth-keeping', topic:'note', date:'2026-11-06', title:'给试过的东西留一份笔记', summary:'记录当时想解决的问题，以及哪些尝试值得下次复用。', sections:[
        ['把具体问题写在开头','「尝试了一个新工具」很难在下次遇到问题时搜出来。标题写成「怎么把浏览器里的片段整理成 Markdown」，以后还能用自己的话把它找回来。'],
        ['留下结果和条件','记下用的输入、耗时，以及哪一步仍然要手工处理。短笔记也可以用这三个信息交代清楚一次实验。'],
        ['复用时补充一行','第二次用同一方法时，把变化追加到原来的笔记。几次积累之后，就能看清哪些步骤适合做进工具。']]},
      {id:'same-task-two-prompts',topic:'ai',date:'2026-10-29',title:'用同一个任务比较两种提示写法',summary:'从输出的可验证性和返工次数评估一次提示调整。',sections:[['固定输入','选一段能快速验收的文档，保留相同的原文和输出格式。第一种提示只给任务，第二种加上范围和验收条件。'],['看得见的比较','逐项标记输出里哪些内容能从原文核对，再记下补充指令的次数。换几个不同题材的样本，才容易看出哪些条件确实值得保留。']]},
      {id:'bookmark-export',topic:'dev',date:'2026-10-17',title:'写一个浏览器书签整理脚本',summary:'用现成的书签导出文件验证整理规则。',sections:[['保留原始文件','先把浏览器导出的书签文件留作备份。整理脚本读取副本并输出一张清单，便于对比原有的文件夹层级。'],['检查重复和标题','同一网址可能有不同的名字，也可能被放进多个文件夹。先在预览里展示这些差异，再决定哪些条目适合合并。']]},
      {id:'weekly-review',topic:'note',date:'2025-12-21',title:'周末项目的一次简单复盘',summary:'把下次打开仓库时最有用的三件事写下来。',sections:[['先记现在能做什么','打开项目，从使用者的视角把能做成的那件事完整走一遍。把入口、数据和关键操作写在同一处，给下一次工作留个起点。'],['给下次留一个可完成的任务','选一个两小时内能验证的改动，记录它解决的使用问题和验收步骤。下次从这里开始，会比重新规划整周容易。']]}
    ];

    const notes = [
      {kind:'写作方法', date:'2026-11-20', title:'把 AI 实测写成能重做的记录', text:'留住任务输入、验收步骤和失败示例。换一个工具时还能复用这份记录。', detail:'先固定一份输入，再各跑一次相同任务。把人工返工拆成补上下文、改实现和补验证，记录每一步的耗时。'},
      {kind:'开发便笺', date:'2026-11-10', title:'空状态也跑一遍真实操作', text:'用空仓库、空文件和正常输入各试一次，看看页面是否说明了下一步。', detail:'用可执行的文案替换「暂无数据」。例如「还没有书签，粘贴一组链接开始整理」。'}
    ];
    const projects = [
      {kind:'项目构想', title:'浏览器书签整理器', text:'把网址清单变成一份可以检查、去重和复制的分享列表。', post:'bookmark-export'},
      {kind:'流程样例', title:'AI 协作验收清单', text:'记录变更范围、复核步骤和未验证事项，给下一轮开发留一个清楚的起点。', post:'working-with-coding-agents'}
    ];

    const main = document.querySelector('main');
    const dialog = document.querySelector('#search');
    const query = document.querySelector('#query');
    const results = document.querySelector('#results');
    const searchCount = document.querySelector('#search-count');
    const theme = document.querySelector('#theme');
    const systemTheme = matchMedia('(prefers-color-scheme: dark)');
    const postLink = post => `#post/${post.id}`;
    const date = post => `<time datetime="${post.date}">${post.date.replaceAll('-', '.')}</time>`;
    const metadata = post => `<div class="meta"><span class="tag">${topics[post.topic]}</span>${date(post)}</div>`;
    const row = post => `<li><a class="row" href="${postLink(post)}">${date(post)}<div><strong>${post.title}</strong><small>${post.summary}</small></div><span class="meta tag">${topics[post.topic]}</span></a></li>`;
    const escapeHtml = value => value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    const progress = document.querySelector('#progress');
    let currentPage = '';
    let currentPost = '';
    let searchOptions = [];
    let selectedResult = -1;

    function indexCards(items) {
      return `<div class="index-grid">${items.map(item => `<article class="index-card"><div class="meta"><span class="tag">${item.kind}</span>${item.date ? date(item) : ''}</div><h3>${item.title}</h3><p>${item.text}</p>${item.post ? `<a href="#post/${item.post}">阅读相关手记</a>` : `<details><summary>展开笔记</summary><p>${item.detail}</p></details>`}</article>`).join('')}</div>`;
    }

    function home() {
      const lead = posts[0];
      return `<section class="hero" aria-labelledby="welcome">
        <div><p class="hero-author">itfetter 的个人博客</p><h1 id="welcome">开发手记</h1>
        <p class="hero-description">写个人项目从想法到做出来的过程，记录日常使用 AI 的体验，也留下一些开发时踩过的坑。</p>
        <div class="actions"><a class="primary" href="#archive">浏览文章</a><a class="secondary" href="#about">关于我</a></div></div>
        <a class="feature" href="${postLink(lead)}"><span class="feature-label">置顶文章</span><h2>${lead.title}</h2><p>${lead.summary}</p>${metadata(lead)}</a>
        </section>
        <div class="home-grid"><section class="section" aria-labelledby="latest-title"><div class="section-head"><h2 id="latest-title">最近文章</h2><a href="#archive">查看归档</a></div><ul class="rows">${posts.slice(1, 5).map(row).join('')}</ul></section>
        <aside class="home-aside" aria-label="主题和笔记"><section><h2>按主题浏览</h2><ul class="topic-list">${Object.entries(topics).map(([key, name]) => `<li><a href="#archive/${key}"><span>${name}</span><span>${posts.filter(post => post.topic === key).length}</span></a></li>`).join('')}</ul></section>
        <section><h2>最近笔记</h2><a class="aside-link" href="#notes"><strong>${notes[0].title}</strong><small>${date(notes[0])}</small></a></section></aside></div>
        <section class="section projects-section"><div class="section-head"><h2>项目与实验</h2><a href="#projects">全部项目</a></div>${indexCards(projects)}</section>`;
    }

    function archive(topic) {
      const selected = Object.hasOwn(topics, topic) ? topic : '';
      const visible = posts.filter(post => !selected || post.topic === selected);
      const years = [...new Set(visible.map(post => post.date.slice(0,4)))];
      return `<div class="page-intro"><h1>文章归档</h1><p>个人开发、AI 工具体验和技术随手记。</p></div>
        <div class="filter-bar"><nav class="filters" aria-label="按主题筛选">${[['','全部'],...Object.entries(topics)].map(([key, name]) => `<a class="pill" href="#archive${key ? '/' + key : ''}"${key === selected ? ' aria-current="true"' : ''}>${name}</a>`).join('')}</nav><span class="subtle" role="status">${visible.length} 篇样稿</span></div>
        ${years.map(year => `<section><h2 class="year">${year}</h2><ul class="rows">${visible.filter(post => post.date.startsWith(year)).map(row).join('')}</ul></section>`).join('')}`;
    }

    function article(post) {
      const related = posts.find(item => item.topic === post.topic && item !== post);
      const links = post.sections.map(([heading], i) => `<li><a href="${postLink(post)}/${i + 1}">${heading}</a></li>`).join('');
      return `<div class="article-grid"><article class="reading"><a class="back" href="#archive">返回文章归档</a>${metadata(post)}<h1>${post.title}</h1><p class="lede">${post.summary}</p><p class="subtle">原型样稿</p>
        <nav class="toc toc-inline" aria-label="本文目录"><strong>本文目录</strong><ol>${links}</ol></nav>
        <div id="article-body">${post.sections.map(([heading, body, code], i) => `<section><h2 id="section-${i + 1}" tabindex="-1">${heading}</h2><p>${body}</p>${code ? `<div class="code-panel"><div class="code-bar"><span class="subtle mono">验收记录</span><button type="button" data-copy>复制</button></div><pre><code>${escapeHtml(code)}</code></pre></div>` : ''}</section>`).join('')}
        ${post === posts[0] ? '<div class="table-scroll" tabindex="0"><table><caption>文章列表验收示例</caption><thead><tr><th scope="col">检查项</th><th scope="col">怎么验证</th><th scope="col">期望结果</th></tr></thead><tbody><tr><th scope="row">空列表</th><td>筛选无匹配内容</td><td>提示可以换一个主题</td></tr><tr><th scope="row">长标题</th><td>在手机宽度阅读两行以上标题</td><td>日期和标题清晰对齐</td></tr><tr><th scope="row">分页</th><td>筛选后切换到下一页</td><td>主题条件继续生效</td></tr></tbody></table></div>' : ''}</div>
        ${related ? `<div class="related"><span class="subtle">继续阅读</span><br><a href="${postLink(related)}">${related.title}</a></div>` : ''}</article>
        <nav class="toc" aria-label="本文目录"><strong>本文目录</strong><ol>${links}</ol></nav></div>`;
    }

    function markdownPreview(markdown) {
      return markdown.trim().split(/(^```[^\n]*\n[\s\S]*?\n```[ \t]*$)/m).map((part, index) => {
        if (index % 2) return `<pre><code>${escapeHtml(part.slice(part.indexOf('\n') + 1, part.lastIndexOf('\n')))}</code></pre>`;
        return escapeHtml(part).replace(/^(#{1,3} .+)$/gm,'\n$1\n').trim().split(/\n\s*\n/).filter(Boolean).map(block => {
          const heading = block.match(/^(#{1,3}) (.+)$/);
          if (heading) {
            const level = heading[1].length + 2;
            return `<h${level}>${heading[2]}</h${level}>`;
          }
          const lines = block.split('\n');
          if (lines.every(line => /^[-*] /.test(line))) return `<ul>${lines.map(line => `<li>${line.slice(2)}</li>`).join('')}</ul>`;
          return `<p>${block.replaceAll('\n','<br>')}</p>`;
        }).join('');
      }).join('');
    }

    function setupStudio() {
      const draft = document.querySelector('#draft');
      const preview = document.querySelector('#draft-preview');
      const status = document.querySelector('#draft-status');
      const download = document.querySelector('#export-draft');
      try { draft.value = localStorage.getItem('itfetter-draft') || ''; } catch {}
      function refreshPreview() {
        preview.innerHTML = markdownPreview(draft.value) || '<p class="subtle">开始写作后，这里会显示预览。</p>';
        download.disabled = !draft.value.trim();
      }
      draft.addEventListener('input', () => {
        try {
          localStorage.setItem('itfetter-draft', draft.value);
          status.textContent = '草稿已保存到当前浏览器';
        } catch { status.textContent = '浏览器未能保存草稿，可以先导出 Markdown。'; }
        refreshPreview();
      });
      download.addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([draft.value], {type:'text/markdown;charset=utf-8'}));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'itfetter-draft.md';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
      refreshPreview();
    }

    function updateProgress() {
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      const active = main.querySelector('.article-grid') && scrollable > 0;
      progress.style.width = `${active ? Math.min(100, Math.max(0, window.scrollY / scrollable * 100)) : 0}%`;
    }

    function render() {
      const [page, key, section] = (location.hash.slice(1) || 'home').split('/');
      const post = page === 'post' && posts.find(item => item.id === key);
      const stayOnArticle = post && post.id === currentPost;
      const stayOnArchive = page === 'archive' && currentPage === 'archive';
      currentPage = page;
      currentPost = post ? post.id : '';
      const current = page === 'post' ? 'archive' : page;
      document.querySelectorAll('.nav a, .studio-link').forEach(link => {
        if (link.hash === `#${current}`) link.setAttribute('aria-current','page');
        else link.removeAttribute('aria-current');
      });
      document.title = `${post ? post.title : ({archive:'文章归档',notes:'开发笔记',projects:'项目与实验',studio:'写作台',about:'关于本站'})[page] || '开发手记'} · itfetter`;
      if (page === 'home') main.innerHTML = home();
      else if (page === 'archive') main.innerHTML = archive(key);
      else if (post) {
        if (!stayOnArticle) main.innerHTML = article(post);
      }
      else if (page === 'notes') main.innerHTML = `<div class="page-intro"><h1>开发笔记</h1><p>短一些的观察、做法和踩坑记录。以下为原型样稿。</p></div>${indexCards(notes)}`;
      else if (page === 'projects') main.innerHTML = `<div class="page-intro"><h1>项目与实验</h1><p>小工具的构想，以及做东西时可以复用的流程样例。</p></div>${indexCards(projects)}`;
      else if (page === 'studio') {
        main.innerHTML = `<div class="page-intro"><h1>写作台</h1><p>草稿保存在当前浏览器，写完可以导出为 Markdown 文件。</p></div><div class="studio-grid"><div class="studio-pane"><label for="draft">Markdown 草稿</label><textarea id="draft" placeholder="## 写下要解决的问题" aria-describedby="draft-help"></textarea><p class="subtle" id="draft-help">预览支持标题、段落、列表和围栏代码块。</p></div><section class="studio-pane studio-preview" aria-labelledby="draft-view-title"><h2 id="draft-view-title">实时预览</h2><div id="draft-preview"></div></section></div><div class="studio-actions"><button class="primary" id="export-draft" type="button">导出 Markdown</button><span class="subtle" id="draft-status" role="status"></span></div>`;
        setupStudio();
      }
      else if (page === 'about') main.innerHTML = `<article class="reading"><h1>关于这个博客</h1><p class="lede">itfetter 的个人开发手记。</p><p>这里会写自己动手做的小项目、日常和 AI 一起工作的体验，以及后来想翻回来看一眼的技术笔记。项目是怎么开始的、工具在哪一步帮了忙、做完后想改哪里，都是值得记下的内容。</p><h2>从哪里开始读</h2><p>可以去 <a class="prose-link" href="#archive">文章归档</a> 按主题找感兴趣的样稿，也可以去 <a class="prose-link" href="https://github.com/itfetter">GitHub</a> 看项目。</p></article>`;
      else main.innerHTML = '<div class="page-intro"><h1>没有找到这个页面</h1><a class="quiet" href="#archive">浏览文章归档</a></div>';
      const heading = post && section && document.getElementById(`section-${section}`);
      if (heading) {
        heading.focus({preventScroll:true});
        heading.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'});
      } else if (stayOnArchive) {
        main.querySelector('.pill[aria-current]').focus({preventScroll:true});
      } else {
        main.focus({preventScroll:true});
        window.scrollTo(0,0);
      }
      main.querySelectorAll('.toc a').forEach(link => {
        if (link.hash === location.hash) link.setAttribute('aria-current','location');
        else link.removeAttribute('aria-current');
      });
      updateProgress();
    }

    function search() {
      const terms = query.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const matches = posts.filter(post => {
        const content = [post.title, topics[post.topic], post.summary, ...post.sections.flat()].join(' ').toLowerCase();
        return terms.every(term => content.includes(term));
      });
      searchOptions = matches;
      selectedResult = -1;
      query.removeAttribute('aria-activedescendant');
      searchCount.textContent = terms.length ? `${matches.length} 篇匹配` : '最近文章';
      results.innerHTML = matches.length ? matches.map((post, index) => `<div role="option" aria-selected="false" id="search-result-${index}" data-result="${index}"><strong>${post.title}</strong><small>${topics[post.topic]} · ${post.date}</small></div>`).join('') : '';
      const empty = dialog.querySelector('.search-empty');
      if (empty) empty.remove();
      if (!matches.length) results.insertAdjacentHTML('afterend','<div class="search-empty"><p>没有找到相关文章。</p><button type="button" class="secondary" id="reset-search">清空搜索</button></div>');
    }

    function openSearch() {
      if (dialog.open) return;
      query.value = '';
      search();
      dialog.showModal();
    }

    function updateThemeButton() {
      const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && systemTheme.matches);
      theme.textContent = dark ? '☀' : '☾';
      theme.setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
      theme.title = theme.getAttribute('aria-label');
    }

    theme.addEventListener('click', () => {
      const mode = document.documentElement.dataset.theme || (systemTheme.matches ? 'dark' : 'light');
      const next = mode === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('itfetter-theme', next); } catch {}
      updateThemeButton();
    });
    systemTheme.addEventListener('change', updateThemeButton);
    document.querySelector('#open-search').addEventListener('click', openSearch);
    query.addEventListener('input', search);
    function openResult(index) {
      const destination = postLink(searchOptions[index]);
      dialog.close();
      if (location.hash === destination) main.focus({preventScroll:true});
      else location.hash = destination;
    }

    results.addEventListener('click', event => {
      const option = event.target.closest('[data-result]');
      if (option) openResult(Number(option.dataset.result));
    });
    dialog.addEventListener('click', event => {
      if (event.target.id === 'reset-search') {
        query.value = '';
        query.focus();
        search();
      }
      if (event.target === dialog) {
        const rect = dialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
      }
    });
    query.addEventListener('keydown', event => {
      if (!searchOptions.length || event.isComposing) return;
      if (event.key === 'Enter') {
        event.preventDefault();
        openResult(Math.max(0, selectedResult));
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const count = searchOptions.length;
        const previous = results.children[selectedResult];
        if (previous) previous.setAttribute('aria-selected','false');
        selectedResult = event.key === 'ArrowDown' ? (selectedResult + 1) % count : (selectedResult <= 0 ? count - 1 : selectedResult - 1);
        const next = results.children[selectedResult];
        next.setAttribute('aria-selected','true');
        query.setAttribute('aria-activedescendant', next.id);
        next.scrollIntoView({block:'nearest'});
      }
    });
    document.addEventListener('keydown', event => {
      const command = (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k';
      const slash = event.key === '/' && !event.target.closest('input,textarea,[contenteditable]');
      if (command || slash) {
        event.preventDefault();
        openSearch();
      }
    });
    document.querySelector('.skip').addEventListener('click', event => {
      event.preventDefault();
      main.focus();
    });
    main.addEventListener('click', async event => {
      const copy = event.target.closest('[data-copy]');
      if (!copy) return;
      try {
        await navigator.clipboard.writeText(copy.closest('.code-panel').querySelector('code').textContent);
        copy.textContent = '已复制';
      } catch { copy.textContent = '请手动复制'; }
    });
    window.addEventListener('scroll', updateProgress, {passive:true});
    window.addEventListener('resize', updateProgress);
    window.addEventListener('hashchange', render);
    updateThemeButton();
    render();
  </script>
</body>
</html>
