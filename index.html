<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="itfetter 的个人博客，记录个人开发、AI 工具实测和日常技术笔记。">
  <title>itfetter · 开发手记</title>
  <script>
    try {
      const saved = localStorage.getItem('itfetter-theme');
      if (saved) document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/svg+xml" href="./assets/itfetter-icon.svg">
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <header class="header">
    <div class="wrap header-inner">
      <a class="brand" href="#home"><img class="mark" src="./assets/itfetter-icon.svg" alt="" width="31" height="31"><span id="brand-name">itfetter</span></a>
      <nav class="nav" aria-label="主导航"><a href="#home">首页</a><a href="#archive">文章</a><a href="#notes">笔记</a><a href="#projects">项目</a><a href="#about">关于</a></nav>
      <div class="tools">
        <button class="icon search-button" id="open-search" aria-label="站内搜索"><span class="lens" aria-hidden="true"></span><span>搜索</span><kbd aria-hidden="true">Ctrl K</kbd></button>
        <button class="icon" id="theme" aria-label="切换配色"></button>
      </div>
    </div>
    <div class="wrap" id="article-return" hidden><a class="back" href="#archive"><span aria-hidden="true">←</span>返回</a></div>
  </header>
  <main id="main" class="wrap" tabindex="-1"><noscript>请启用 JavaScript 浏览博客原型。</noscript></main>
  <footer><div class="wrap footer-inner"><span id="footer-brand"></span><div class="footer-links"><a href="#about">关于本站</a><a id="github-link" hidden>GitHub</a></div></div></footer>
  <dialog class="search-dialog" id="search" aria-labelledby="search-label">
    <div class="search-heading"><h2 id="search-label">站内搜索</h2><form method="dialog"><button class="icon" aria-label="关闭搜索">×</button></form></div>
    <div class="search-form"><span class="lens" aria-hidden="true"></span><input type="search" id="query" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="results" aria-label="搜索关键词" placeholder="输入标题、主题或关键词" autocomplete="off" autofocus></div>
    <p class="search-count" id="search-count" role="status"></p>
    <div class="search-results" id="results" role="listbox" aria-label="搜索结果"></div>
    <div class="search-help"><span><kbd>↑</kbd> <kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span></div>
  </dialog>
  <script src="./content.js"></script>
  <script src="./markdown.js"></script>
  <script>
    const {topics, posts, notes, projects, settings} = window.blogContent;
    const {escape:escapeHtml, blocks:markdownBlocks, render:renderMarkdown,coverImage} = window.blogMarkdown;
    posts.sort((a,b) => b.date.localeCompare(a.date));
    notes.sort((a,b) => b.date.localeCompare(a.date));
    document.querySelector('#brand-name').textContent = settings.author;
    document.querySelector('#footer-brand').textContent = `© ${new Date().getFullYear()} ${settings.author} · ${settings.title}`;
    document.querySelector('meta[name="description"]').content = settings.description;
    const github = document.querySelector('#github-link');
    if (settings.github) {
      github.href = settings.github;
      github.hidden = false;
    }

    const main = document.querySelector('main');
    const articleReturnBar = document.querySelector('#article-return');
    const articleBack = articleReturnBar.querySelector('a');
    const dialog = document.querySelector('#search');
    const query = document.querySelector('#query');
    const results = document.querySelector('#results');
    const searchCount = document.querySelector('#search-count');
    const theme = document.querySelector('#theme');
    const systemTheme = matchMedia('(prefers-color-scheme: dark)');
    const postLink = post => `#post/${post.id}`;
    const date = post => `<time datetime="${post.date}">${post.date.replaceAll('-', '.')}</time>`;
    const metadata = post => `<div class="meta"><span class="tag">${topics[post.topic]}</span>${date(post)}</div>`;
    const commentLabel = post => `${post.commentCount ?? 0} 条评论`;
    const engagementLabel = post => `${post.viewCount ?? 0} 次浏览 · ${post.likeCount ?? 0} 赞`;
    const cover = item => item.id === 'project-markdown-preview' && item.sample ?
      coverImage({cover:'assets/markdown-preview.jpg',coverAlt:'显示文档和预览分栏的电脑与纸质笔记本'}) : coverImage(item);
    const row = post => `<li><a class="row" href="${postLink(post)}">${date(post)}<div class="row-content"><strong>${escapeHtml(post.title)}</strong><small>${escapeHtml(post.summary)}</small></div><span class="row-meta"><span class="tag">${topics[post.topic]}</span><span class="article-counts">${engagementLabel(post)} <span aria-hidden="true">·</span> ${commentLabel(post)}</span></span></a></li>`;
    const progress = document.querySelector('#progress');
    let currentPage = '';
    let currentPost = '';
    let searchOptions = [];
    let selectedResult = -1;
    let pendingReturn;

    const noteLink = note => `#notes/${encodeURIComponent(note.id)}`;
    const projectLink = project => `#projects/${encodeURIComponent(project.id)}`;
    const sampleLabel = item => item.sample ? '<span>示例</span>' : '';

    function notesPage(key, category) {
      const kinds = [...new Set(notes.map(note => note.kind))];
      const selected = key === "category" ? kinds.find(kind => encodeURIComponent(kind) === category) : "";
      const visible = selected ? notes.filter(note => note.kind === selected) : notes;
      return `<div class="page-intro"><h1>开发笔记</h1><p>随手记下的开发做法、AI 实测和踩坑记录。</p></div>
        <div class="filter-bar"><nav class="filters" aria-label="按笔记类别筛选"><a class="pill" href="#notes"${selected ? "" : ' aria-current="true"'}>全部</a>${kinds.map(kind => `<a class="pill" href="#notes/category/${encodeURIComponent(kind)}"${kind === selected ? ' aria-current="true"' : ""}>${escapeHtml(kind)}</a>`).join("")}</nav><span class="subtle" role="status">${visible.length} 条笔记</span></div>
        <div class="note-list">${visible.map(note => {
          const active = noteLink(note) === location.hash;
          const heading = `<span class="meta">${date(note)}<span class="tag">${escapeHtml(note.kind)}</span>${sampleLabel(note)}</span><span class="note-title">${escapeHtml(note.title)}</span><span class="note-summary">${escapeHtml(note.text)}</span>`;
          return `<article class="note-entry"${active ? ' id="selected-note" tabindex="-1"' : ""}>${note.detail ? `<details${active ? " open" : ""}><summary>${heading}</summary><div class="note-detail reading">${renderMarkdown(markdownBlocks(note.detail),false,true)}</div></details>` : heading}</article>`;
        }).join("") || '<p class="subtle">暂无已发布的笔记。</p>'}</div>`;
    }

    function projectCards(items) {
      if (!items.length) return '<p class="subtle">暂无已发布项目。</p>';
      return `<div class="index-grid">${items.map(project => `<article class="index-card"><div class="meta"><span class="project-status">${escapeHtml(project.kind)}</span>${sampleLabel(project)}</div><h3>${escapeHtml(project.title)}</h3><p>${escapeHtml(project.text)}</p><a class="project-link" href="${projectLink(project)}">查看项目 <span aria-hidden="true">→</span><span class="sr-only"> ${escapeHtml(project.title)}</span></a></article>`).join("")}</div>`;
    }

    function projectsPage(key) {
      const project = projects.find(item => projectLink(item) === `#projects/${key}`);
      if (!project) return `<div class="page-intro"><h1>项目与实验</h1><p>记录小工具的实现过程、当前进度和下一步。</p></div>${projectCards(projects)}`;
      const related = posts.find(post => post.id === project.post);
      return `<article class="reading project-detail"><a class="quiet" href="#projects">← 全部项目</a>
        <div class="meta"><span class="project-status">${escapeHtml(project.kind)}</span>${sampleLabel(project)}</div>
        <h1>${escapeHtml(project.title)}</h1><p class="lede">${escapeHtml(project.text)}</p>
        ${project.url ? `<a class="secondary" href="${escapeHtml(project.url)}">访问项目 ↗</a>` : ""}
        ${cover(project)}${project.detail ? renderMarkdown(markdownBlocks(project.detail),false,true) : ""}
        ${related ? `<div class="related"><span class="subtle">相关手记</span><br><a href="${postLink(related)}">${escapeHtml(related.title)}</a></div>` : ""}</article>`;
    }

    function home() {
      const lead = posts.find(post => post.id === settings.featured);
      const latest = posts.filter(post => post !== lead).slice(0,4);
      return `<section class="hero" aria-labelledby="welcome">
        <div><p class="hero-author">${escapeHtml(settings.author)} 的个人博客</p><h1 id="welcome">${escapeHtml(settings.title)}</h1>
        <p class="hero-description">${escapeHtml(settings.description)}</p>
        <div class="actions"><a class="primary" href="#archive">浏览文章</a><a class="secondary" href="#about">关于我</a></div></div>
        ${lead ? `<a class="feature" href="${postLink(lead)}">${cover(lead)}<span class="feature-label">置顶文章</span><h2>${escapeHtml(lead.title)}</h2><p>${escapeHtml(lead.summary)}</p><div class="meta"><span class="tag">${topics[lead.topic]}</span>${date(lead)}<span class="article-counts">${engagementLabel(lead)} <span aria-hidden="true">·</span> ${commentLabel(lead)}</span></div></a>` : ''}
        </section>
        <div class="home-grid"><section class="section" aria-labelledby="latest-title"><div class="section-head"><h2 id="latest-title">最近文章</h2><a href="#archive">查看归档</a></div>${latest.length ? `<ul class="rows">${latest.map(row).join('')}</ul>` : '<p class="subtle">暂无最近文章。</p>'}</section>
        <aside class="home-aside" aria-label="主题和笔记"><section><h2>按主题浏览</h2><ul class="topic-list">${Object.entries(topics).map(([key, name]) => `<li><a href="#archive/${key}"><span>${name}</span><span>${posts.filter(post => post.topic === key).length}</span></a></li>`).join('')}</ul></section>
        ${notes.length ? `<section><h2>最近笔记</h2>${notes.slice(0,2).map(note => `<a class="aside-link" href="${noteLink(note)}"><strong>${escapeHtml(note.title)}</strong><small>${date(note)}</small></a>`).join("")}<a class="quiet" href="#notes">全部笔记 →</a></section>` : ""}</aside></div>
        <section class="section projects-section"><div class="section-head"><h2>项目与实验</h2><a href="#projects">全部项目</a></div>${projectCards(projects.slice(0,4))}</section>`;
    }

    function archive(topic) {
      const selected = Object.hasOwn(topics, topic) ? topic : '';
      const visible = posts.filter(post => !selected || post.topic === selected);
      const years = [...new Set(visible.map(post => post.date.slice(0,4)))];
      return `<div class="page-intro"><h1>文章归档</h1><p>个人开发、AI 工具体验和技术随手记。</p></div>
        <div class="filter-bar"><nav class="filters" aria-label="按主题筛选">${[['','全部'],...Object.entries(topics)].map(([key, name]) => `<a class="pill" href="#archive${key ? '/' + key : ''}"${key === selected ? ' aria-current="true"' : ''}>${name}</a>`).join('')}</nav><span class="subtle" role="status">${visible.length} 篇文章</span></div>
        ${years.map(year => `<section><h2 class="year">${year}</h2><ul class="rows">${visible.filter(post => post.date.startsWith(year)).map(row).join('')}</ul></section>`).join('') || '<p class="subtle year">这个主题暂无文章。</p>'}`;
    }

    function article(post) {
      const related = posts.find(item => item.topic === post.topic && item !== post);
      const body = renderMarkdown(markdownBlocks(post.body),true);
      const parsed = document.createElement('template');
      parsed.innerHTML = body;
      const links = [...parsed.content.querySelectorAll('[id^=section-]')].map((heading,i) =>
        `<li><a href="${postLink(post)}/${i + 1}"><span class="toc-index" aria-hidden="true">${i + 1}.</span><span>${escapeHtml(heading.textContent)}</span></a></li>`).join('');
      const discussion = `<a class="toc-comments" href="${postLink(post)}/comments"><span>讨论与评论</span><span class="comment-count" data-comment-count>${commentLabel(post)}</span></a>`;
      const toc = `${links ? `<ol>${links}</ol>` : ''}${discussion}`;
      return `<div class="article-grid"><article class="reading">${metadata(post)}<h1>${escapeHtml(post.title)}</h1><p class="lede">${escapeHtml(post.summary)}</p>${post.sample ? '<p class="meta">原型样稿</p>' : ''}
        <div class="article-engagement"><span data-view-count>${post.viewCount ?? 0} 次浏览</span><button type="button" class="secondary" aria-label="点赞文章" aria-pressed="false" disabled><span aria-hidden="true">♡</span><span data-like-label>点赞 ${post.likeCount ?? 0}</span></button><span role="status"></span></div>
        <details class="toc toc-inline"><summary>本文目录</summary><div>${toc}</div></details>${cover(post)}<div id="article-body">${body}</div>
        ${related ? `<div class="related"><span class="subtle">继续阅读</span><br><a href="${postLink(related)}">${escapeHtml(related.title)}</a></div>` : ''}
        <section class="article-comments" aria-labelledby="section-comments"><div class="discussion-heading"><h2 id="section-comments" tabindex="-1">讨论与评论</h2><span class="comment-count" data-comment-count>${commentLabel(post)}</span></div>
        <div class="comment-composer"><form class="comment-form" hidden><div class="comment-reply" hidden><strong></strong><button type="button">取消回复</button></div><label><span class="sr-only">评论内容</span><textarea name="body" rows="3" maxlength="2000" required placeholder="分享你的想法，或提一个问题"></textarea></label><div class="comment-form-actions"><label>昵称<input name="author" maxlength="40" autocomplete="nickname" required></label><button type="submit" class="primary">发表评论</button></div><p class="comment-feedback" data-compose-status role="status"></p></form></div>
        <p class="comment-feedback" role="status">正在加载评论…</p><button type="button" class="secondary comment-retry" hidden>重新加载</button><div class="comment-list"></div></section></article><nav class="toc" aria-label="本文目录"><strong>本文目录</strong>${toc}</nav></div>`;
    }

    function mountEngagement(post) {
      const panel = main.querySelector('.article-engagement');
      const view = panel.querySelector('[data-view-count]');
      const button = panel.querySelector('button');
      const status = panel.querySelector('[role=status]');
      const endpoint = `./api/post-stats?post=${encodeURIComponent(post.id)}`;
      let liked = false;

      async function update(action) {
        button.disabled = true;
        status.textContent = '';
        try {
          const response = await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(action)});
          if (!response.ok) throw new Error();
          const result = await response.json();
          post.viewCount = result.viewCount;
          post.likeCount = result.likeCount;
          liked = result.liked;
          view.textContent = `${post.viewCount} 次浏览`;
          button.setAttribute('aria-pressed', String(liked));
          button.querySelector('[aria-hidden]').textContent = liked ? '♥' : '♡';
          button.querySelector('[data-like-label]').textContent = `${liked ? '已点赞' : '点赞'} ${post.likeCount}`;
          button.disabled = false;
        } catch {
          if (action === 'view') status.textContent = '实时统计暂不可用。';
          else {
            status.textContent = '点赞未保存，请重试。';
            button.disabled = false;
          }
        }
      }
      button.addEventListener('click', () => update(liked ? 'unlike' : 'like'));
      update('view');
    }

    function mountComments(post) {
      const section = main.querySelector('.article-comments');
      const counts = section.closest('.article-grid').querySelectorAll('[data-comment-count]');
      const endpoint = `./api/comments?post=${encodeURIComponent(post.id)}`;
      const form = section.querySelector('form');
      const list = section.querySelector('.comment-list');
      const status = section.querySelector('.comment-feedback');
      const retry = section.querySelector('.comment-retry');
      const reply = section.querySelector('.comment-reply');
      const home = form.parentElement;
      const feedback = form.querySelector('[data-compose-status]');
      const submit = form.querySelector('[type=submit]');
      let comments = [];
      let parent = '';
      let replyButton;
      const drafts = new Map();
      const dates = new Intl.DateTimeFormat('zh-CN', {dateStyle:'medium',timeStyle:'short'});

      function display(items) {
        comments = items;
        const replies = new Map();
        const threads = [];
        for (const item of items) {
          if (!item.parent) threads.push(item);
          else {
            if (!replies.has(item.parent)) replies.set(item.parent, []);
            replies.get(item.parent).push(item);
          }
        }
        const renderComment = item => {
          const body = escapeHtml(item.body).replace(/\x60([^\x60\n]+)\x60/g, '<code>$1</code>');
          return `<article class="comment" tabindex="-1" data-comment-id="${escapeHtml(item.id)}"><span class="comment-avatar" aria-hidden="true">${escapeHtml([...item.author][0] || '')}</span><div class="comment-content"><header><strong>${escapeHtml(item.author)}</strong>${item.sample ? '<span class="comment-sample">示例</span>' : ''}<time datetime="${escapeHtml(item.created)}">${dates.format(new Date(item.created))}</time></header><p>${body}</p>${item.parent ? '' : `<button type="button" class="comment-reply-button" aria-expanded="false" data-reply="${escapeHtml(item.id)}">回复<span class="sr-only"> ${escapeHtml(item.author)}</span></button>`}</div></article>`;
        };
        list.innerHTML = threads.length ? threads.map(item => {
          const children = replies.get(item.id);
          return `<div class="comment-thread">${renderComment(item)}${children ? `<div class="comment-children">${children.map(renderComment).join('')}</div>` : ''}</div>`;
        }).join('') : '<p class="comment-empty">还没有评论，欢迎留下第一条。</p>';
        post.commentCount = items.length;
        counts.forEach(count => { count.textContent = commentLabel(post); });
      }

      function setReply(item, button) {
        drafts.set(parent, form.elements.body.value);
        replyButton?.setAttribute('aria-expanded','false');
        replyButton = button;
        parent = item?.id || '';
        if (button) {
          button.setAttribute('aria-expanded','true');
          button.closest('.comment').after(form);
        } else home.append(form);
        form.classList.toggle('is-reply', Boolean(item));
        form.elements.body.value = drafts.get(parent) || '';
        form.elements.body.placeholder = item ? '写下你的回复' : '分享你的想法，或提一个问题';
        reply.hidden = !item;
        reply.querySelector('strong').textContent = item ? `回复 ${item.author}` : '';
        submit.textContent = item ? '发布回复' : '发表评论';
        feedback.textContent = '';
      }

      async function loadComments() {
        retry.hidden = true;
        status.textContent = '正在加载评论…';
        try {
          const response = await fetch(endpoint);
          if (!response.ok) throw new Error();
          display(await response.json());
          form.hidden = false;
          status.textContent = '';
        } catch {
          status.textContent = '评论暂时不可用。';
          retry.hidden = false;
        }
      }

      retry.addEventListener('click',loadComments);
      function cancelReply() {
        if (!replyButton || submit.disabled) return;
        const trigger = replyButton;
        setReply();
        trigger.focus();
      }
      reply.querySelector('button').addEventListener('click', cancelReply);
      list.addEventListener('click', event => {
        const button = event.target.closest('[data-reply]');
        if (button && !submit.disabled) {
          if (button === replyButton) { cancelReply(); return; }
          setReply(comments.find(item => item.id === button.dataset.reply),button);
          form.elements.body.focus();
        }
      });
      form.elements.body.addEventListener('keydown', event => {
        if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && !event.isComposing) {
          event.preventDefault();
          if (!submit.disabled) form.requestSubmit();
        }
      });
      form.addEventListener('keydown', event => {
        if (event.key === 'Escape' && replyButton && !event.isComposing) cancelReply();
      });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (submit.disabled) return;
        const body = {...Object.fromEntries(new FormData(form)),parent};
        submit.disabled = true;
        feedback.textContent = '正在发布…';
        try {
          const response = await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || '发布失败，请重试。');
          form.elements.body.value = '';
          setReply();
          display(result);
          list.querySelector(`[data-comment-id="${CSS.escape(result.at(-1).id)}"]`)?.focus();
          status.textContent = '已发布。';
        } catch (error) {
          feedback.textContent = error instanceof SyntaxError || error instanceof TypeError ? '发布失败，请检查连接后重试。' : error.message;
        } finally { submit.disabled = false; }
      });
      loadComments();
    }

    function updateProgress() {
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      const article = main.querySelector('.article-grid');
      progress.style.width = `${article && scrollable > 0 ? Math.min(100, Math.max(0, window.scrollY / scrollable * 100)) : 0}%`;
      if (!article) return;
      const headings = [...article.querySelectorAll('[id^=section-]')];
      const offset = parseFloat(getComputedStyle(headings[0]).scrollMarginTop) + 1;
      const comments = headings.at(-1);
      const atBottom = window.scrollY > 0 && window.scrollY >= scrollable - 2 && comments.getBoundingClientRect().top < window.innerHeight;
      const current = atBottom ? comments : headings.findLast(heading => heading.getBoundingClientRect().top <= offset);
      const currentHash = current ? `#post/${currentPost}/${current.id.slice('section-'.length)}` : '';
      for (const link of article.querySelectorAll('.toc a')) {
        if (link.hash === currentHash) link.setAttribute('aria-current','location');
        else link.removeAttribute('aria-current');
      }
    }

    function about() {
      const featured = posts.find(post => post.id === settings.featured);
      return `<div class="about-page"><header class="about-header">
        <p class="about-label">关于本站</p><h1>你好，我是 ${escapeHtml(settings.author)}</h1>
        <p class="lede">我喜欢把平时遇到的小麻烦做成工具。这里记下我是怎么做的，也聊聊把 AI 用进开发之后，哪些地方真的省了时间。</p>
        ${settings.github ? `<a class="secondary" href="${escapeHtml(settings.github)}">访问 GitHub <span aria-hidden="true">↗</span></a>` : ''}
        </header><div class="about-grid">
        ${settings.about.trim() ? `<section class="reading about-story" aria-labelledby="about-story"><h2 id="about-story">我在这里写什么</h2>${renderMarkdown(markdownBlocks(settings.about))}</section>` : ''}
        <nav class="about-links" aria-labelledby="about-links"><h2 id="about-links">从这里开始</h2>
        ${featured ? `<a class="about-feature" href="${postLink(featured)}"><span><small>推荐阅读</small><strong>${escapeHtml(featured.title)}</strong></span><span aria-hidden="true">→</span></a>` : ''}
        <a href="#archive"><span>文章归档</span><span aria-hidden="true">→</span></a>
        <a href="#notes"><span>开发笔记</span><span aria-hidden="true">→</span></a>
        <a href="#projects"><span>项目与实验</span><span aria-hidden="true">→</span></a>
        </nav></div></div>`;
    }

    function navigateToArticle(destination, searchText) {
      if (location.hash === destination) return;
      const sameArticle = currentPost && destination.split('/')[1] === currentPost;
      const previous = history.state?.articleReturn;
      // A table-of-contents jump keeps the article's original entry point.
      const articleReturn = sameArticle ? (previous && {...previous, steps:previous.steps + 1}) :
        {hash:location.hash || '#home', steps:1, top:window.scrollY, searchText};
      history.pushState({articleReturn}, '', destination);
      render();
    }

    function render() {
      const [page, key, section] = (location.hash.slice(1) || 'home').split('/');
      const post = page === 'post' && posts.find(item => item.id === key);
      const stayOnArticle = post && post.id === currentPost;
      const stayOnArchive = page === 'archive' && currentPage === 'archive';
      const filterNotes = page === 'notes' && currentPage === 'notes' && (!key || key === 'category');
      const returning = pendingReturn;
      pendingReturn = undefined;
      currentPage = page;
      currentPost = post ? post.id : '';
      articleReturnBar.hidden = !post;
      main.classList.toggle('article-page',Boolean(post));
      if (post) articleBack.href = history.state?.articleReturn?.hash || '#archive';
      const current = page === 'post' ? 'archive' : page;
      document.querySelectorAll('.nav a').forEach(link => {
        if (link.hash === `#${current}`) link.setAttribute('aria-current','page');
        else link.removeAttribute('aria-current');
      });
      document.title = `${post ? post.title : ({archive:'文章归档',notes:'开发笔记',projects:'项目与实验',about:'关于本站'})[page] || settings.title} · ${settings.author}`;
      if (page === 'home') main.innerHTML = home();
      else if (page === 'archive') main.innerHTML = archive(key);
      else if (post) {
        if (!stayOnArticle) {
          main.innerHTML = article(post);
          mountComments(post);
          mountEngagement(post);
        }
      }
      else if (page === 'notes') main.innerHTML = notesPage(key, section);
      else if (page === 'projects') main.innerHTML = projectsPage(key);
      else if (page === 'about') main.innerHTML = about();
      else main.innerHTML = '<div class="page-intro"><h1>没有找到这个页面</h1><a class="quiet" href="#archive">浏览文章归档</a></div>';
      const heading = post && section ? document.getElementById(`section-${section}`) : main.querySelector('#selected-note');
      if (returning) {
        main.focus({preventScroll:true});
        window.scrollTo(0, returning.top);
        if (returning.searchText !== undefined) openSearch(returning.searchText);
      } else if (heading) {
        heading.focus({preventScroll:true});
        heading.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'});
      } else if (stayOnArchive || filterNotes) {
        main.querySelector('.pill[aria-current]').focus({preventScroll:true});
      } else {
        main.focus({preventScroll:true});
        window.scrollTo(0,0);
      }
      updateProgress();
    }

    function search() {
      const terms = query.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const articleResults = posts.map(post => ({title:post.title, href:postLink(post), label:`文章 · ${topics[post.topic]}`, text:[post.summary, post.body]}));
      const records = terms.length ? [
        ...articleResults,
        ...notes.map(note => ({title:note.title, href:noteLink(note), label:`笔记 · ${note.kind}`, text:[note.text, note.detail]})),
        ...projects.map(project => ({title:project.title, href:projectLink(project), label:`项目 · ${project.kind}`, text:[project.text, project.detail]}))
      ] : articleResults;
      const matches = records.filter(item => {
        const text = [item.title, item.label, ...item.text].join(' ').toLowerCase();
        return terms.every(term => text.includes(term));
      });
      searchOptions = matches;
      selectedResult = -1;
      query.removeAttribute('aria-activedescendant');
      searchCount.textContent = terms.length ? `${matches.length} 条匹配` : '最近文章';
      results.innerHTML = matches.map((item, index) => `<div role="option" aria-selected="false" id="search-result-${index}" data-result="${index}"><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.label)}</small></div>`).join('');
      results.hidden = !matches.length;
      results.scrollTop = 0;
      query.setAttribute('aria-expanded', String(matches.length > 0));
      const empty = dialog.querySelector('.search-empty');
      if (empty) empty.remove();
      if (!matches.length) results.insertAdjacentHTML('afterend','<div class="search-empty"><p>没有找到匹配的文章、笔记或项目。</p><button type="button" class="secondary" id="reset-search">清空搜索</button></div>');
    }

    function openSearch(searchText = '') {
      if (dialog.open) return;
      query.value = searchText;
      search();
      dialog.showModal();
    }

    function updateThemeButton() {
      const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && systemTheme.matches);
      theme.innerHTML = dark
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14a8.5 8.5 0 0 1-10.5-10.5A8.5 8.5 0 1 0 20.5 14Z"/></svg>';
      theme.setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
      theme.title = theme.getAttribute('aria-label');
    }

    theme.addEventListener('click', () => {
      const mode = document.documentElement.dataset.theme || (systemTheme.matches ? 'dark' : 'light');
      const next = mode === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('itfetter-theme', next); } catch {}
      updateThemeButton();
    });
    systemTheme.addEventListener('change', updateThemeButton);
    document.querySelector('#open-search').addEventListener('click', () => openSearch());
    query.addEventListener('input', search);
    function openResult(index) {
      const destination = searchOptions[index].href;
      dialog.close();
      if (location.hash === destination) main.focus({preventScroll:true});
      else if (destination.startsWith('#post/')) navigateToArticle(destination, query.value);
      else location.hash = destination;
    }

    results.addEventListener('click', event => {
      const option = event.target.closest('[data-result]');
      if (option) openResult(Number(option.dataset.result));
    });
    dialog.addEventListener('click', event => {
      if (event.target.id === 'reset-search') {
        query.value = '';
        query.focus();
        search();
      }
      if (event.target === dialog) {
        const rect = dialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
      }
    });
    query.addEventListener('keydown', event => {
      if (!searchOptions.length || event.isComposing) return;
      if (event.key === 'Enter') {
        event.preventDefault();
        openResult(Math.max(0, selectedResult));
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const count = searchOptions.length;
        const previous = results.children[selectedResult];
        if (previous) previous.setAttribute('aria-selected','false');
        selectedResult = event.key === 'ArrowDown' ? (selectedResult + 1) % count : (selectedResult <= 0 ? count - 1 : selectedResult - 1);
        const next = results.children[selectedResult];
        next.setAttribute('aria-selected','true');
        query.setAttribute('aria-activedescendant', next.id);
        next.scrollIntoView({block:'nearest'});
      }
    });
    document.addEventListener('keydown', event => {
      const command = (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k';
      const slash = event.key === '/' && !event.target.closest('input,textarea,[contenteditable]');
      if (command || slash) {
        event.preventDefault();
        openSearch();
      }
    });
    document.querySelector('.skip').addEventListener('click', event => {
      event.preventDefault();
      main.focus();
    });
    main.addEventListener('click', async event => {
      const link = event.target.closest('a');
      if (link && event.button === 0 && !event.defaultPrevented && !event.altKey && !event.ctrlKey && !event.metaKey && !event.shiftKey) {
        const destination = link.getAttribute('href');
        if (destination?.startsWith('#post/')) {
          event.preventDefault();
          navigateToArticle(destination);
          return;
        }
      }
      const copy = event.target.closest('[data-copy]');
      if (!copy) return;
      try {
        await navigator.clipboard.writeText(copy.closest('.code-panel').querySelector('code').textContent);
        copy.textContent = '已复制';
      } catch { copy.textContent = '请手动复制'; }
    });
    articleBack.addEventListener('click', event => {
      if (event.button !== 0 || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      const previous = history.state?.articleReturn;
      if (!previous) return;
      event.preventDefault();
      pendingReturn = previous;
      history.go(-previous.steps);
    });
    window.addEventListener('scroll', updateProgress, {passive:true});
    window.addEventListener('resize', updateProgress);
    window.addEventListener('hashchange', render);
    updateThemeButton();
    render();
  </script>
</body>
</html>
