<div class="admin-layout">
  <aside class="admin-sidebar">
    <h1>博客管理</h1>
    <nav class="admin-nav" aria-label="管理后台">
      <button type="button" data-view="overview" aria-current="page">总览</button>
      <button type="button" data-view="posts">文章</button>
      <button type="button" data-view="notes">笔记</button>
      <button type="button" data-view="projects">项目</button>
      <button type="button" data-view="settings">站点设置</button>
    </nav>
  </aside>
  <section class="admin-workspace" aria-label="管理内容">
    <div id="admin-page"><p class="subtle">正在加载站点内容…</p></div>
    <p id="admin-status" class="admin-feedback" role="status"></p>
  </section>
</div>
<dialog id="admin-delete" aria-labelledby="delete-heading">
  <h2 id="delete-heading">删除这条内容？</h2>
  <p></p>
  <form method="dialog" class="actions">
    <button value="cancel" class="secondary" autofocus>取消</button>
    <button value="delete" class="danger-button">确认删除</button>
  </form>
</dialog>
<script src="/markdown.js"></script>
<script src="/admin/editor.js"></script>
